version: '3'
services:
  jenkins:
    container_name: jenkins
    image: jenkins-ansible
    build:
      context: jenkins-ansible     
    ports:
      - "8080:8080"
    volumes:
      - $PWD/jenkins_home:/var/jenkins_home
    networks:
      - net
  db_host:
    container_name: db
    image: mysql:oraclelinux9
    environment:
      - "MYSQL_ROOT_PASSWORD=xyz"
    volumes:
      - $PWD/db_data:/var/lib/mysql
    networks:
      - net
    web:
      container_name: web
      image: ansible-web
      build:
        context: jenkins-ansible/web
      ports:
        - "80:80"
      networks:
        - net    
networks:
  net: